name: checks

# The repository invariants are enforced for Claude Code sessions by a PostToolUse hook
# (.claude/settings.json). This job is the same check for everyone else — a plain push or a PR
# opened outside that workflow. See CLAUDE.md for what is being enforced and why.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  html-artifacts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/html-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tools/*.test.mjs
      - run: node tools/index.mjs --check
      - run: node tools/reachability.mjs
      - run: node tools/refresh-examples.mjs --check
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check_invariants.py
      # Provider contracts use in-process fakes: no vendor credential or network call is made.
      # All three skills share this dependency set, so one install is sufficient.
      - run: python3 -m pip install -r skills/multi-llm-debate/scripts/requirements.txt
      - run: python3 tools/check_provider_contracts.py

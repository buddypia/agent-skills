<!-- ==========================================================================
     module: annotated-walkthrough
     Interactive step-by-step walkthrough paired with diagram/code hotspots.
     Requires: interactions.js (HA.walkthrough).
     ========================================================================== -->
<style data-module="annotated-walkthrough">
.wk { display: grid; gap: var(--sp-4); padding: var(--sp-5); border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); }
  .wk-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-3); }
  .wk-title-wrap { display: grid; gap: 2px; min-width: 0; }
  .wk-title { margin: 0; font: var(--type-h3); color: var(--text-primary); }
  .wk-sub { margin: 0; font: var(--type-small); color: var(--text-muted); }
  .wk-nav { display: inline-flex; align-items: center; gap: var(--sp-2); }
  .wk-readout { font: var(--type-caption); font-family: var(--font-mono); font-weight: 700; color: var(--text-secondary); min-width: 3.5em; text-align: center; }
  .wk-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(260px, 1fr); gap: var(--sp-4); align-items: start; }
  .wk-stage { padding: var(--sp-4); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--bg-card); display: grid; gap: var(--sp-3); min-width: 0; }
  .wk-stage svg { width: 100%; height: auto; display: block; font-family: var(--font-sans); }
  .wk-node { padding: var(--sp-3); border: 1px solid var(--border-default); border-radius: var(--radius-sm); background: var(--bg-surface); display: flex; align-items: flex-start; gap: var(--sp-3); transition: opacity var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); cursor: pointer; }
  .wk-node.is-dimmed, [data-walk-target].is-dimmed { opacity: 0.42; }
  .wk-node.is-active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--bg-surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
  .wk-pin { flex: none; width: 24px; height: 24px; border-radius: var(--radius-pill); display: grid; place-items: center; font: var(--type-caption); font-family: var(--font-mono); font-weight: 800; color: var(--on-accent); background: var(--accent); }
  .wk-node-body { display: grid; gap: 2px; min-width: 0; }
  .wk-node-label { font: var(--type-small); font-weight: 700; color: var(--text-primary); }
  .wk-node-code { font: 12px/1.45 var(--font-mono); color: var(--text-secondary); overflow-wrap: anywhere; }
  .wk-steps { display: grid; gap: var(--sp-2); min-width: 0; }
  .wk-step { appearance: none; text-align: left; width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--sp-3); align-items: start; padding: var(--sp-3); border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-card); cursor: pointer; transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }
  .wk-step:hover { border-color: var(--border-strong); }
  .wk-step.is-active, .wk-step[aria-current="step"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--bg-surface)); }
  .wk-num { width: 24px; height: 24px; border-radius: var(--radius-pill); display: grid; place-items: center; font: var(--type-caption); font-family: var(--font-mono); font-weight: 700; color: var(--text-secondary); background: var(--bg-muted); border: 1px solid var(--border-subtle); }
  .wk-step.is-active .wk-num { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .wk-step-body { display: grid; gap: 3px; min-width: 0; }
  .wk-step-title { font: var(--type-small); font-weight: 700; color: var(--text-primary); }
  .wk-step-desc { font: var(--type-small); color: var(--text-secondary); line-height: 1.5; }
  .wk-step-meta { font: var(--type-caption); font-family: var(--font-mono); color: var(--text-muted); }
  @media (max-width: 900px) { .wk-grid { grid-template-columns: 1fr; } }
  @media (max-width: 720px) { .wk { padding: var(--sp-4); } }
</style>

<section class="wk" data-walkthrough aria-label="ステップ別解説ウォークスルー">
  <div class="wk-bar">
    <div class="wk-title-wrap">
      <h3 class="wk-title">処理フロー解説</h3>
      <p class="wk-sub">右のステップをクリックすると該当箇所がハイライトされます。</p>
    </div>
    <div class="wk-nav no-print">
      <button type="button" class="btn-ghost btn-sm" data-walk-prev aria-label="前のステップ">← 前へ</button>
      <span class="wk-readout" data-walk-readout>1 / 3</span>
      <button type="button" class="btn-ghost btn-sm" data-walk-next aria-label="次のステップ">次へ →</button>
    </div>
  </div>

  <div class="wk-grid">
    <div class="wk-stage">
      <div class="wk-node is-active" data-walk-target="1">
        <span class="wk-pin">1</span>
        <div class="wk-node-body">
          <span class="wk-node-label">署名と有効期限の検証</span>
          <code class="wk-node-code">verifyJwt(token, { clockToleranceSec: 30 })</code>
        </div>
      </div>
      <div class="wk-node" data-walk-target="2">
        <span class="wk-pin">2</span>
        <div class="wk-node-body">
          <span class="wk-node-label">共有ストアでのレート制限判定</span>
          <code class="wk-node-code">redis.incrByWindow(ipKey, 60_000)</code>
        </div>
      </div>
      <div class="wk-node" data-walk-target="3">
        <span class="wk-pin">3</span>
        <div class="wk-node-body">
          <span class="wk-node-label">入力内容を保持した再認証</span>
          <code class="wk-node-code">on401 -&gt; openReauthModal({ preserveDraft: true })</code>
        </div>
      </div>
    </div>

    <div class="wk-steps" role="group" aria-label="解説ステップ一覧">
      <button type="button" class="wk-step is-active" data-walk-step="1" aria-current="step">
        <span class="wk-num">1</span>
        <span class="wk-step-body">
          <span class="wk-step-title">トークン期限を 30 秒猶予に短縮</span>
          <span class="wk-step-desc">漏洩トークンの再送窓を狭め、許容超過分は警告ログのみ残します。</span>
          <span class="wk-step-meta">src/auth/verify.ts:42</span>
        </span>
      </button>
      <button type="button" class="wk-step" data-walk-step="2">
        <span class="wk-num">2</span>
        <span class="wk-step-body">
          <span class="wk-step-title">インスタンス間で試行回数を共有</span>
          <span class="wk-step-desc">分散環境でも 1 分間の連続失敗回数を正確に集計します。</span>
          <span class="wk-step-meta">src/middleware/rateLimit.ts:18</span>
        </span>
      </button>
      <button type="button" class="wk-step" data-walk-step="3">
        <span class="wk-num">3</span>
        <span class="wk-step-body">
          <span class="wk-step-title">作業中の下書きを失わずに復帰</span>
          <span class="wk-step-desc">401 発生時に強制リロードせず、再認証モーダルだけを重ねます。</span>
          <span class="wk-step-meta">src/ui/SessionNotice.tsx:64</span>
        </span>
      </button>
    </div>
  </div>
</section>

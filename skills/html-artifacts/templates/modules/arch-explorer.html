<!-- ============================================================================
MODULE: arch-explorer                                       lineage: unified-system v7 architecture flagship
PURPOSE: Self-contained interactive architecture explorer. Combines a layered
         or topology SVG canvas with scenario flow filters, smooth bezier routing,
         typed nodes (gateway/service/worker/queue/database/client/external) with
         tech badges and inline SVG glyphs, and a responsive inspector panel that
         reveals component specs and walkthrough steps on click.
VARIABLES: {{TITLE}} {{DESC}} {{SCENARIOS_JSON}} {{LABELS_JSON}} + tab/legend label slots
REQUIRES: core/tokens.css, core/elements.css, core/interactions.js
MODULE CSS: inline the data-module="arch-explorer" style block once.
PREFER THE BUILDER: `section.type: "arch-explorer"` routes nodes/edges/zones/scenarios
  through the layout engine in tools/build.mjs, which fans out shared node faces, arcs
  lateral edges over intervening nodes, places every edge label by collision search
  against node rects, and emits the numbered step badges. Hand-pasting this file means
  hand-placing all of that - a midpoint label that lands on a node is the single
  biggest legibility failure this module has.
INTERACTION: [data-arch-explorer] attaches HA.archExplorer:
  * Scenario tabs [data-scenario-tab="ID"]: dims unrelated nodes/edges, animates
    active edges with flowing pulses, reveals that scenario's numbered step badges,
    and populates the walkthrough panel.
  * Default "all" tab: inspector shows a clickable scenario index ([data-scenario-jump]).
  * Node click [data-node="ID"]: switches inspector to node spec mode (role, tech,
    inbound, outbound, source files).
  * Step hover/click [data-scenario-step="N"]: focuses that edge, its two nodes and
    its step badge (.is-focus) while the rest of the diagram recedes.
  * Zoom/Pan: .stage[data-zoompan] + controls.
============================================================================ -->
<style data-module="arch-explorer">
  .archexp { width: 100%; display: grid; gap: var(--sp-4); }
  .archexp-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--sp-3); }
  .archexp-title { font: var(--type-h2); color: var(--text-primary); margin: 0; }
  .archexp-desc { font: var(--type-small); color: var(--text-secondary); margin-top: var(--sp-1); max-width: 75ch; }

  /* scenario filter tabs */
  .archexp-tabs { display: flex; flex-wrap: wrap; gap: var(--sp-2); padding: var(--sp-1); background: var(--bg-muted); border: 1px solid var(--border-subtle); border-radius: var(--radius-pill); }
  .archexp-tab { appearance: none; border: none; background: transparent; color: var(--text-secondary); font: var(--type-caption); font-weight: 600; padding: var(--sp-1) var(--sp-3); border-radius: var(--radius-pill); cursor: pointer; transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
  .archexp-tab:hover { color: var(--text-primary); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .archexp-tab.active { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-sm); }
  .archexp-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* main split workbench */
  .archexp-workbench { display: grid; grid-template-columns: minmax(0, 1.85fr) minmax(310px, 1.15fr); gap: var(--sp-4); align-items: start; }
  @media (max-width: 1024px) {
    .archexp-workbench { grid-template-columns: 1fr; }
  }
  /* Wide mode (set by the builder for dense topologies): a 900+ unit viewBox squeezed
     into the 1.85fr column renders 13px node labels at ~10px. Give the canvas the whole
     width and move the inspector underneath as a multi-column step index instead. */
  .archexp[data-wide] .archexp-workbench { grid-template-columns: 1fr; }
  .archexp[data-wide] .archexp-inspector { min-height: 0; }
  .archexp[data-wide] .archexp-insp-body { max-height: none; }
  .archexp[data-wide] .archexp-steps-list { grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); }
  .archexp[data-wide] .archexp-node-spec { max-width: 80ch; }

  /* canvas stage */
  .archexp-stage-wrap { position: relative; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--bg-muted); overflow: hidden; }
  .archexp .stage { position: relative; width: 100%; min-height: 460px; overflow: hidden; cursor: grab; touch-action: none; }
  .archexp .stage.panning, .archexp .stage:active { cursor: grabbing; }
  .archexp svg { width: 100%; height: auto; display: block; font-family: var(--font-sans); }

  /* controls & legend */
  .archexp-controls { position: absolute; top: var(--sp-2); right: var(--sp-2); display: flex; align-items: center; gap: 2px; z-index: 2; background: color-mix(in srgb, var(--bg-surface) 92%, transparent); backdrop-filter: blur(8px); padding: 2px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); }
  .archexp-controls .btn-sm { min-width: 24px; height: 24px; padding: 0 5px; font-size: 12px; line-height: 1; }
  .archexp-readout { font: var(--type-caption); font-family: var(--font-mono); color: var(--text-secondary); min-width: 3.8ch; padding-inline: 4px; text-align: center; }
  .archexp-legend { display: flex; flex-wrap: wrap; gap: var(--sp-3); padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--border-subtle); background: var(--bg-surface); font: var(--type-caption); }
  .archexp-legend-item { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .archexp-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* zones */
  .archexp .zone-rect { fill: var(--bg-surface); fill-opacity: 0.55; stroke: var(--border-default); stroke-width: 1; stroke-dasharray: 4 4; rx: 10px; }
  .archexp .zone-title { fill: var(--text-secondary); font: var(--type-caption); font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .archexp .zone-desc { fill: var(--text-muted); font-size: 10.5px; }

  /* nodes */
  .archexp [data-node] { cursor: pointer; transition: opacity var(--dur-mid) var(--ease), filter var(--dur-mid) var(--ease); outline: none; }
  .archexp .node-card { fill: var(--bg-surface); stroke: var(--nc, var(--border-default)); stroke-width: 1.5; rx: 8px; transition: stroke var(--dur-fast) var(--ease), stroke-width var(--dur-fast) var(--ease), fill var(--dur-fast) var(--ease); }
  .archexp .node-icon-bg { fill: color-mix(in srgb, var(--nc, var(--accent)) 12%, var(--bg-surface)); stroke: color-mix(in srgb, var(--nc, var(--accent)) 24%, transparent); stroke-width: 1; rx: 6px; }
  .archexp .node-icon { color: var(--nc, var(--accent)); stroke: currentColor; fill: none; }
  .archexp .node-label { fill: var(--text-primary); font-size: 13px; font-weight: 600; }
  .archexp .node-sub { fill: var(--text-secondary); font-size: 11px; }
  .archexp .node-badge { fill: color-mix(in srgb, var(--nc, var(--accent)) 10%, var(--bg-muted)); rx: 4px; }
  .archexp .node-badge-text { fill: var(--nc, var(--text-secondary)); font-size: 10px; font-family: var(--font-mono); font-weight: 600; }

  /* node type accent colors */
  .archexp .nt-client { --nc: var(--cat-2); }
  .archexp .nt-gateway { --nc: var(--cat-1); }
  .archexp .nt-worker { --nc: var(--cat-4); }
  .archexp .nt-queue { --nc: var(--color-warning); }
  .archexp .nt-database { --nc: var(--cat-5); }
  .archexp .nt-external { --nc: var(--cat-3); }

  /* node states */
  .archexp [data-node]:hover .node-card { stroke: var(--nc, var(--accent)); stroke-width: 2; }
  .archexp [data-node].is-selected .node-card { stroke: var(--accent); stroke-width: 2.2; fill: color-mix(in srgb, var(--accent) 5%, var(--bg-surface)); }
  .archexp [data-node].is-dimmed { opacity: 0.4; filter: grayscale(55%); }
  .archexp [data-node].is-focus .node-card { stroke: var(--accent); stroke-width: 2.5; }

  /* edges */
  .archexp .edge-path { stroke: color-mix(in srgb, var(--text-muted) 75%, transparent); stroke-width: 1.5; fill: none; stroke-linecap: round; transition: stroke var(--dur-mid) var(--ease), stroke-width var(--dur-mid) var(--ease), opacity var(--dur-mid) var(--ease); }
  .archexp .edge-path.is-dimmed { opacity: 0.18; }
  .archexp .edge-path.is-active { stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 6 4; animation: archexpPulse 1.2s linear infinite; marker-end: url(#archexp-arrow-active); }
  .archexp .edge-path.is-focus { stroke: var(--accent); stroke-width: 3.2; opacity: 1; }
  .archexp .edge-badge-rect { fill: var(--bg-surface); stroke: var(--border-subtle); stroke-width: 1; rx: 4px; }
  .archexp .edge-label { fill: var(--text-secondary); font-size: 10.5px; font-family: var(--font-mono); font-weight: 600; text-anchor: middle; }

  /* scenario step badges */
  .archexp .archexp-stepbadge { transition: transform var(--dur-fast) var(--ease); }
  .archexp .edge-step-badge { fill: var(--accent); stroke: var(--bg-surface); stroke-width: 2; }
  .archexp .edge-step-num { fill: var(--on-accent); font-size: 11px; font-family: var(--font-mono); font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .archexp .archexp-stepbadge.is-focus { transform-box: fill-box; transform-origin: center; }
  .archexp .archexp-stepbadge.is-focus .edge-step-badge { r: 12.5; }

  @keyframes archexpPulse {
    from { stroke-dashoffset: 20; }
    to { stroke-dashoffset: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .archexp .edge-path.is-active { animation: none; }
  }

  /* inspector side panel */
  .archexp-inspector { border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--bg-surface); overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-height: 460px; }
  .archexp-insp-head { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border-subtle); background: var(--bg-muted); display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
  .archexp-insp-tag { font: var(--type-caption); font-family: var(--font-mono); font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
  .archexp-insp-close { appearance: none; border: none; background: transparent; font-size: 18px; color: var(--text-muted); cursor: pointer; border-radius: var(--radius-xs); line-height: 1; padding: 2px 6px; }
  .archexp-insp-close:hover { color: var(--text-primary); background: var(--border-subtle); }
  .archexp-insp-body { padding: var(--sp-4); display: grid; gap: var(--sp-4); align-content: start; max-height: 600px; overflow-y: auto; }

  /* inspector content: node spec card */
  .archexp-node-spec h3 { font: var(--type-h3); margin-top: var(--sp-1); color: var(--text-primary); }
  .archexp-node-spec .role-badge { display: inline-flex; align-items: center; gap: 4px; font: var(--type-caption); font-family: var(--font-mono); padding: 2px 8px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--accent) 12%, var(--bg-muted)); color: var(--accent); font-weight: 600; margin-bottom: var(--sp-2); }
  .archexp-node-spec p { font: var(--type-small); color: var(--text-secondary); line-height: 1.55; }
  .archexp-spec-dl { display: grid; gap: var(--sp-2); margin-top: var(--sp-3); font: var(--type-small); }
  .archexp-spec-row { display: grid; grid-template-columns: 85px 1fr; gap: var(--sp-2); padding: var(--sp-2) 0; border-bottom: 1px solid var(--border-subtle); }
  .archexp-spec-row:last-child { border-bottom: none; }
  .archexp-spec-key { font-weight: 600; color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .archexp-spec-val { color: var(--text-primary); font-size: 12.5px; }
  .archexp-spec-val code { font-family: var(--font-mono); font-size: 11.5px; background: var(--bg-muted); padding: 1px 5px; border-radius: var(--radius-xs); }

  /* inspector content: scenario walkthrough */
  .archexp-steps-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-2); }
  .archexp-step-item { display: grid; grid-template-columns: 28px 1fr; gap: var(--sp-3); padding: var(--sp-3); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); background: var(--bg-muted); cursor: pointer; transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }
  .archexp-step-item:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, var(--bg-surface)); }
  .archexp-step-item.is-active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg-surface)); }
  .archexp-step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font: var(--type-caption); font-family: var(--font-mono); font-weight: 700; display: grid; place-items: center; }
  .archexp-step-title { font-weight: 600; font-size: 13px; color: var(--text-primary); }
  .archexp-step-desc { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
  .archexp-step-proto { display: inline-block; font-size: 10px; font-family: var(--font-mono); color: var(--accent); font-weight: 600; margin-top: 4px; }
</style>

<!-- data-wide: set it when the topology is dense (>=3 columns or >=10 nodes) so the
     canvas takes the full width and the inspector drops below it.
     data-scenarios / data-labels: JSON, see reference/04-module-catalog.md. -->
<div class="archexp" data-arch-explorer data-wide data-scenarios="{{SCENARIOS_JSON}}" data-labels="{{LABELS_JSON}}" aria-label="{{TITLE}}">
  <header class="archexp-head">
    <div>
      <h2 class="archexp-title">{{TITLE}}</h2>
      <p class="archexp-desc">{{DESC}}</p>
    </div>
    <!-- One tab per scenario, plus the always-present "all" tab. Tab ids must match
         the keys in data-scenarios below. -->
    <nav class="archexp-tabs no-print" role="tablist" aria-label="Architecture Scenarios">
      <button class="archexp-tab active" data-scenario-tab="all" role="tab" aria-selected="true">{{TAB_ALL}}</button>
      <button class="archexp-tab" data-scenario-tab="{{SCENARIO_1_ID}}" role="tab" aria-selected="false">{{SCENARIO_1_NAME}}</button>
      <button class="archexp-tab" data-scenario-tab="{{SCENARIO_2_ID}}" role="tab" aria-selected="false">{{SCENARIO_2_NAME}}</button>
    </nav>
  </header>

  <div class="archexp-workbench">
    <div class="archexp-stage-wrap">
      <div class="archexp-controls no-print">
        <button class="btn btn-ghost btn-sm" data-zoom-in aria-label="{{ZOOM_IN}}">+</button>
        <button class="btn btn-ghost btn-sm" data-zoom-out aria-label="{{ZOOM_OUT}}">−</button>
        <button class="btn btn-ghost btn-sm" data-zoom-reset aria-label="{{ZOOM_RESET}}">⤢</button>
        <span class="archexp-readout" data-zoom-readout>100%</span>
      </div>

      <div class="stage" data-zoompan data-zoom-min="0.3" data-zoom-max="2.5" tabindex="0">
        <svg viewBox="0 0 880 680" role="img" aria-label="{{TITLE}}">
          <defs>
            <marker id="archexp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,1 L9,5 L0,9 z" fill="var(--text-muted)"/>
            </marker>
            <marker id="archexp-arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,1 L9,5 L0,9 z" fill="var(--accent)"/>
            </marker>
          </defs>
          <g data-viewport>
            <!-- Zones, Edges, Nodes injected here -->
          </g>
        </svg>
      </div>

      <!-- List only the node types this diagram actually uses. -->
      <footer class="archexp-legend no-print">
        <span class="archexp-legend-item"><span class="archexp-dot" style="background:var(--cat-2)"></span> {{LEGEND_CLIENT}}</span>
        <span class="archexp-legend-item"><span class="archexp-dot" style="background:var(--cat-1)"></span> {{LEGEND_GATEWAY}}</span>
        <span class="archexp-legend-item"><span class="archexp-dot" style="background:var(--cat-4)"></span> {{LEGEND_WORKER}}</span>
        <span class="archexp-legend-item"><span class="archexp-dot" style="background:var(--color-warning)"></span> {{LEGEND_QUEUE}}</span>
        <span class="archexp-legend-item"><span class="archexp-dot" style="background:var(--cat-5)"></span> {{LEGEND_DATABASE}}</span>
        <span class="archexp-legend-item"><span class="archexp-dot" style="background:var(--cat-3)"></span> {{LEGEND_EXTERNAL}}</span>
      </footer>
    </div>

    <aside class="archexp-inspector" aria-label="{{INSPECTOR_LABEL}}">
      <header class="archexp-insp-head">
        <span class="archexp-insp-tag" data-insp-title>{{SCENARIO_FLOW_LABEL}}</span>
        <button class="archexp-insp-close" data-insp-reset aria-label="{{RESET_LABEL}}">↺</button>
      </header>
      <div class="archexp-insp-body" data-insp-content>
        <!-- Dynamic content: scenario steps or node specs -->
      </div>
    </aside>
  </div>
</div>

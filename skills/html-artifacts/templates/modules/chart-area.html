<!-- ============================================================================
MODULE: chart-area                                 lineage: unified-system original (v4 expressiveness pass)
PURPOSE: Self-contained SVG stacked area chart (NO external libs). 2-3 series
         stacked over 5-7 time points as translucent color-mix(--cat-N) bands, each
         with a visible top edge; x labels + y gridlines. Shows how a TOTAL and its
         composition evolve continuously. Distinction: chart-line overlays
         independent series on a common baseline (compare levels); chart-stacked is
         discrete stacked BARS at separate categories; chart-area stacks continuous
         bands so the top edge reads as the running total and each band as its share.
VARIABLES: {{TITLE}}; per series a filled {{AREA_N}} path + a top-edge {{EDGE_N}}
           polyline; per time point {{XLABEL}}; legend {{SERIES}}.
SCALING:   plot x 40→700 (6 points at x=40,172,304,436,568,700); baseline y=280,
           top y=40 (240px). Cumulative value → y = 280 − cum/MAX*240 (MAX = the
           largest stack total). AREA_N = top edge (cumₙ) then bottom edge (cumₙ₋₁,
           reversed) closed; series 1's bottom edge is the baseline y=280. Replace
           the example coords with your own via this map.
REQUIRES:  core/tokens.css (--cat-1..3, --accent, --text-*, --border-subtle,
           --border-default, --bg-surface, --radius-xs), core/elements.css (.card-outlined)
MODULE CSS: inline the data-module="chart-area" style block once.
INTERACTION: none required. Bands deepen on svg:hover (paint only, reduced-motion
           guarded). role="img" + <title> a11y.
USAGE: draw bands bottom→top (series 1 first) so upper edges sit on top; one
       <path class="ac-area cat-N"> + one <polyline class="ac-edge cat-N"> per series.
============================================================================ -->
<style data-module="chart-area">
  .ac { width: 100%; }
  .ac-title { font: var(--type-h3); color: var(--text-primary); margin-bottom: var(--sp-4); }
  .ac svg { width: 100%; height: auto; font-family: var(--font-sans); overflow: visible; }
  .ac .ac-grid { stroke: var(--border-subtle); stroke-width: 1; }
  .ac .ac-axis { stroke: color-mix(in srgb, var(--accent) 28%, var(--border-default)); stroke-width: 1.5; stroke-linecap: round; }
  .ac .ac-cat { fill: var(--text-muted); font-size: 12px; text-anchor: middle; letter-spacing: var(--tracking-tight); }
  /* bands: translucent cat fills; the top edge is a firmer same-hue stroke */
  .ac .ac-area { stroke: none; transition: fill-opacity var(--dur-fast) var(--ease); }
  .ac .ac-area.cat-1 { fill: color-mix(in srgb, var(--cat-1) 30%, transparent); }
  .ac .ac-area.cat-2 { fill: color-mix(in srgb, var(--cat-2) 30%, transparent); }
  .ac .ac-area.cat-3 { fill: color-mix(in srgb, var(--cat-3) 30%, transparent); }
  .ac .ac-edge { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .ac .ac-edge.cat-1 { stroke: color-mix(in srgb, var(--cat-1) 78%, var(--border-default)); }
  .ac .ac-edge.cat-2 { stroke: color-mix(in srgb, var(--cat-2) 78%, var(--border-default)); }
  .ac .ac-edge.cat-3 { stroke: color-mix(in srgb, var(--cat-3) 78%, var(--border-default)); }
  .ac svg:hover .ac-area { fill-opacity: 1.35; }
  .ac-legend { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-3); }
  .ac-legend span { display: inline-flex; align-items: center; gap: var(--sp-2); font: var(--type-caption); color: var(--text-secondary); }
  .ac-legend i { width: 11px; height: 11px; border-radius: var(--radius-xs); }
  .ac-legend .cat-1 { background: color-mix(in srgb, var(--cat-1) 60%, var(--bg-surface)); }
  .ac-legend .cat-2 { background: color-mix(in srgb, var(--cat-2) 60%, var(--bg-surface)); }
  .ac-legend .cat-3 { background: color-mix(in srgb, var(--cat-3) 60%, var(--bg-surface)); }
  @media (prefers-reduced-motion: reduce) { .ac .ac-area { transition: none; } }
</style>

<figure class="ac card-outlined">
  <figcaption class="ac-title">{{TITLE}}</figcaption>
  <svg viewBox="0 0 720 320" role="img" aria-label="{{TITLE}}">
    <title>{{TITLE}}</title>
    <!-- gridlines (quartiles of the 240px plot, baseline 280) -->
    <line class="ac-grid" x1="40" y1="40"  x2="700" y2="40"/>
    <line class="ac-grid" x1="40" y1="100" x2="700" y2="100"/>
    <line class="ac-grid" x1="40" y1="160" x2="700" y2="160"/>
    <line class="ac-grid" x1="40" y1="220" x2="700" y2="220"/>
    <line class="ac-axis" x1="40" y1="280" x2="700" y2="280"/>

    <!-- ↓ bands bottom→top; replace coords via SCALING (series 1 bottom = baseline 280) -->
    <path class="ac-area cat-1" d="{{AREA_N}}"/> <!-- e.g. M40,232 L172,222 L304,213 L436,208 L568,198 L700,189 L700,280 L40,280 Z -->
    <path class="ac-area cat-2" d="{{AREA_N}}"/> <!-- e.g. M40,196 … L700,189 L568,198 … L40,232 Z -->
    <path class="ac-area cat-3" d="{{AREA_N}}"/> <!-- e.g. M40,172 … L700,126 L568,141 … L40,196 Z -->
    <polyline class="ac-edge cat-1" points="{{EDGE_N}}"/> <!-- e.g. 40,232 172,222 304,213 436,208 568,198 700,189 -->
    <polyline class="ac-edge cat-2" points="{{EDGE_N}}"/> <!-- e.g. 40,196 172,179 304,174 436,155 568,141 700,126 -->
    <polyline class="ac-edge cat-3" points="{{EDGE_N}}"/> <!-- e.g. 40,172 172,150 304,131 436,117 568,93 700,74 -->

    <!-- ↓ one x label per time point (x = 40,172,304,436,568,700) -->
    <text class="ac-cat" x="40"  y="300">{{XLABEL}}</text>  <!-- e.g. 1月 -->
    <text class="ac-cat" x="172" y="300">{{XLABEL}}</text>  <!-- e.g. 2月 -->
    <text class="ac-cat" x="304" y="300">{{XLABEL}}</text>  <!-- e.g. 3月 -->
    <text class="ac-cat" x="436" y="300">{{XLABEL}}</text>  <!-- e.g. 4月 -->
    <text class="ac-cat" x="568" y="300">{{XLABEL}}</text>  <!-- e.g. 5月 -->
    <text class="ac-cat" x="700" y="300">{{XLABEL}}</text>  <!-- e.g. 6月 -->
    <!-- ↑ repeat per point -->
  </svg>

  <div class="ac-legend">
    <span><i class="cat-1"></i>{{SERIES}}</span> <!-- e.g. 新規 -->
    <span><i class="cat-2"></i>{{SERIES}}</span> <!-- e.g. 既存 -->
    <span><i class="cat-3"></i>{{SERIES}}</span> <!-- e.g. 復帰 -->
    <!-- ↑ repeat per series -->
  </div>
</figure>

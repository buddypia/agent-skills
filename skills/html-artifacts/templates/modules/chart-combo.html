<!-- ============================================================================
MODULE: chart-combo                                         lineage: unified-system original (v5 high-frequency pass)
PURPOSE: Self-contained SVG combo chart (NO external libs). Bars encode a PRIMARY
         measure on the left axis; an overlaid line + dots encode a SECONDARY measure
         with its own right-side axis (different units). Correlates two measures on
         one canvas - e.g. monthly revenue (bars) vs growth-rate % (line).
         Distinction: chart-bar and chart-line each show ONE measure against one
         axis; this dual-axis view pairs two measures with different scales/units so
         their relationship reads at a glance.
VARIABLES: {{TITLE}}; axis titles {{PRIMARY_AXIS}} {{SECONDARY_AXIS}}; left ticks
           {{P_MID}} {{P_MAX}}; right ticks {{S_MID}} {{S_MAX}}; per category
           {{CAT}} {{P_VALUE}} (bar) {{S_VALUE}} (line point).
GEOMETRY:  viewBox 640×360. Left axis x=52, right axis x=588, baseline y=300, top
           y=36 (264px range). 6 category centers spread across: 97,186,275,365,454,543
           (bar width 48, x = center−24). Bar H = P_VALUE/P_MAX×264, Y = 300−H.
           Line point CY = 300 − S_VALUE/S_MAX×264 at the category center.
REQUIRES:  core/tokens.css (--cat-1, --cat-4, --accent, --text-*, --border-subtle,
           --border-default, --bg-surface, --font-mono), core/elements.css (.card-outlined)
MODULE CSS: inline the data-module="chart-combo" style block once.
INTERACTION: none required. Bars/dots highlight on hover (paint only, reduced-motion
             guarded). role="img" + <title> a11y; per-mark <title> tooltips.
USAGE: duplicate one bar <g> per category and one <circle class="dot"> per line point;
       keep the polyline points in sync with the dot centers.
============================================================================ -->
<style data-module="chart-combo">
  .cmb { width: 100%; }
  .cmb svg { width: 100%; height: auto; font-family: var(--font-sans); overflow: visible; }
  @media (max-width: 640px) { .cmb { overflow-x: auto; } .cmb svg { min-width: 640px; } }
  .cmb-title { font: var(--type-h3); color: var(--text-primary); margin-bottom: var(--sp-4); }
  .cmb .grid-line { stroke: var(--border-subtle); stroke-width: 1; }
  .cmb .axis { stroke: color-mix(in srgb, var(--accent) 28%, var(--border-default)); stroke-width: 1.5; stroke-linecap: round; }
  /* bars = primary measure (left axis); transition paint only, never geometry */
  .cmb .bar { fill: color-mix(in srgb, var(--cat-1) 78%, var(--bg-surface)); stroke: color-mix(in srgb, var(--accent) 22%, transparent); stroke-width: 1; transition: fill var(--dur-fast) var(--ease), filter var(--dur-fast) var(--ease); }
  .cmb .bar:hover { fill: var(--accent); filter: brightness(1.06); }
  /* line = secondary measure (right axis) */
  .cmb .line { fill: none; stroke: var(--cat-4); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--cat-4) 30%, transparent)); }
  .cmb .dot { fill: var(--cat-4); stroke: var(--bg-surface); stroke-width: 2; transition: r var(--dur-fast) var(--ease); }
  .cmb .dot:hover { r: 6; }
  .cmb .tick { fill: var(--text-muted); font-size: 10.5px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .cmb .cat { fill: var(--text-muted); font-size: 12px; text-anchor: middle; letter-spacing: var(--tracking-tight); }
  .cmb .axis-label { fill: var(--text-secondary); font-size: 11.5px; font-weight: 600; text-anchor: middle; }
  @media (prefers-reduced-motion: reduce) { .cmb .bar, .cmb .dot { transition: none; } }
</style>

<figure class="cmb card-outlined" aria-label="{{TITLE}}">
  <figcaption class="cmb-title">{{TITLE}}</figcaption>
  <svg viewBox="0 0 640 360" role="img" aria-label="{{TITLE}}">
    <title>{{TITLE}}</title>
    <!-- gridlines (thirds of the 264px plot; baseline 300, top 36) -->
    <line class="grid-line" x1="52" y1="124" x2="588" y2="124"/>
    <line class="grid-line" x1="52" y1="212" x2="588" y2="212"/>
    <!-- axes: left = primary, right = secondary, baseline -->
    <line class="axis" x1="52" y1="36" x2="52" y2="300"/>
    <line class="axis" x1="588" y1="36" x2="588" y2="300"/>
    <line class="axis" x1="52" y1="300" x2="588" y2="300"/>
    <!-- left ticks (primary) -->
    <text class="tick" x="46" y="304" text-anchor="end">0</text>
    <text class="tick" x="46" y="216" text-anchor="end">{{P_MID}}</text>  <!-- e.g. 300 -->
    <text class="tick" x="46" y="40"  text-anchor="end">{{P_MAX}}</text>  <!-- e.g. 600 -->
    <!-- right ticks (secondary) -->
    <text class="tick" x="594" y="304">0</text>
    <text class="tick" x="594" y="216">{{S_MID}}</text> <!-- e.g. 12% -->
    <text class="tick" x="594" y="40">{{S_MAX}}</text>  <!-- e.g. 24% -->
    <!-- axis titles -->
    <text class="axis-label" x="20"  y="168" transform="rotate(-90 20 168)">{{PRIMARY_AXIS}}</text>   <!-- e.g. 売上(万円) -->
    <text class="axis-label" x="624" y="168" transform="rotate(90 624 168)">{{SECONDARY_AXIS}}</text> <!-- e.g. 成長率 -->

    <!-- ↓ BARS: one <g> per category (H = P_VALUE/P_MAX×264, Y = 300−H) -->
    <g><rect class="bar" x="73"  y="159" width="48" height="141" rx="4"><title>{{CAT}}: {{P_VALUE}}</title></rect><text class="cat" x="97"  y="318">{{CAT}}</text></g> <!-- e.g. 1月 -->
    <g><rect class="bar" x="162" y="133" width="48" height="167" rx="4"><title>{{CAT}}: {{P_VALUE}}</title></rect><text class="cat" x="186" y="318">{{CAT}}</text></g>
    <g><rect class="bar" x="251" y="146" width="48" height="154" rx="4"><title>{{CAT}}: {{P_VALUE}}</title></rect><text class="cat" x="275" y="318">{{CAT}}</text></g>
    <g><rect class="bar" x="341" y="106" width="48" height="194" rx="4"><title>{{CAT}}: {{P_VALUE}}</title></rect><text class="cat" x="365" y="318">{{CAT}}</text></g>
    <g><rect class="bar" x="430" y="80"  width="48" height="220" rx="4"><title>{{CAT}}: {{P_VALUE}}</title></rect><text class="cat" x="454" y="318">{{CAT}}</text></g>
    <g><rect class="bar" x="519" y="54"  width="48" height="246" rx="4"><title>{{CAT}}: {{P_VALUE}}</title></rect><text class="cat" x="543" y="318">{{CAT}}</text></g>
    <!-- ↑ repeat -->

    <!-- LINE = secondary measure (CY = 300 − S_VALUE/S_MAX×264 at each center) -->
    <polyline class="line" points="97,216 186,173 275,237 365,142 454,110 543,68"/>
    <circle class="dot" cx="97"  cy="216" r="4"><title>{{CAT}}: {{S_VALUE}}</title></circle>
    <circle class="dot" cx="186" cy="173" r="4"><title>{{CAT}}: {{S_VALUE}}</title></circle>
    <circle class="dot" cx="275" cy="237" r="4"><title>{{CAT}}: {{S_VALUE}}</title></circle>
    <circle class="dot" cx="365" cy="142" r="4"><title>{{CAT}}: {{S_VALUE}}</title></circle>
    <circle class="dot" cx="454" cy="110" r="4"><title>{{CAT}}: {{S_VALUE}}</title></circle>
    <circle class="dot" cx="543" cy="68"  r="4"><title>{{CAT}}: {{S_VALUE}}</title></circle>
    <!-- ↑ repeat -->
  </svg>
</figure>

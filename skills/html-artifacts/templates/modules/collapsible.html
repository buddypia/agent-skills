<!-- ============================================================================
MODULE: collapsible                                          lineage: html-artifacts(report/spec) + html-visual(document)
PURPOSE: Disclosure / FAQ list built on native <details><summary> - open/close
         with zero JS, keyboard-accessible by default, animated chevron.
VARIABLES (per item): {{SUMMARY}} (question / heading)  {{BODY}} (answer / content)
REQUIRES: core/tokens.css (--border-subtle, --bg-surface/-muted, --text-*,
          --radius-md, --sp-*, --type-*, --dur-fast, --ease)
MODULE CSS: inline the data-module="collapsible" style block once.
INTERACTION: native <details> toggle - NO JavaScript. Chevron rotates on [open].
USAGE: repeat the <details> block once per item inside .collapsible-list.
       Add `open` to a <details> to render it expanded by default.
============================================================================ -->
<style data-module="collapsible">
  .collapsible-list { display: flex; flex-direction: column; gap: var(--sp-3); }
  .collapsible {
    position: relative;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    background: var(--bg-surface);
    overflow: hidden;
    transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  /* accent rail - hairline by default, blooms when the item is open */
  .collapsible::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 2px;
    background: var(--accent);
    opacity: 0;
    transition: opacity var(--dur-fast) var(--ease);
  }
  .collapsible:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border-subtle)); }
  .collapsible[open] {
    border-color: color-mix(in srgb, var(--accent) 32%, var(--border-default));
    box-shadow: var(--shadow-sm);
  }
  .collapsible[open]::before { opacity: 1; }
  .collapsible > summary {
    display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
    padding: var(--sp-4) var(--sp-5);
    min-height: 44px;
    cursor: pointer;
    font: var(--type-body); font-weight: 600; color: var(--text-primary);
    list-style: none;                       /* hide default marker (Firefox) */
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .collapsible > summary::-webkit-details-marker { display: none; }  /* hide default marker (WebKit) */
  .collapsible > summary:hover { background: var(--bg-muted); color: var(--accent); }
  .collapsible > summary:active { background: color-mix(in srgb, var(--accent) 8%, var(--bg-muted)); }
  .collapsible > summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: -2px;
    border-radius: var(--radius-md);
  }
  .collapsible[open] > summary:hover { background: color-mix(in srgb, var(--accent) 6%, var(--bg-surface)); }
  .collapsible .chevron {
    flex: 0 0 auto; color: var(--text-muted);
    transition: transform var(--dur-mid) var(--ease), color var(--dur-fast) var(--ease);
  }
  .collapsible > summary:hover .chevron { color: var(--accent); }
  .collapsible[open] > summary .chevron { transform: rotate(180deg); color: var(--accent); }
  .collapsible[open] > summary { color: var(--accent); }
  .collapsible-body {
    padding: 0 var(--sp-5) var(--sp-4);
    font: var(--type-small); color: var(--text-secondary);
    border-top: 1px solid var(--border-subtle);
    padding-top: var(--sp-4);
  }
  /* gentle accent-tinted wash behind the answer body for confident depth */
  .collapsible[open] > .collapsible-body {
    border-top-color: color-mix(in srgb, var(--accent) 18%, var(--border-subtle));
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 4%, transparent), transparent 64%);
  }
  .collapsible-body > * + * { margin-top: var(--sp-3); }
</style>

<section class="collapsible-list" aria-label="Frequently asked questions">

  <!-- ↓ repeat one <details> per item (add `open` to expand by default) -->
  <details class="collapsible">
    <summary>
      {{SUMMARY}}
      <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </summary>
    <div class="collapsible-body">{{BODY}}</div>
  </details>
  <!-- ↑ repeat -->

  <details class="collapsible">
    <summary>
      {{SUMMARY}}
      <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </summary>
    <div class="collapsible-body">{{BODY}}</div>
  </details>

  <details class="collapsible">
    <summary>
      {{SUMMARY}}
      <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </summary>
    <div class="collapsible-body">{{BODY}}</div>
  </details>

</section>

<!-- ============================================================================
MODULE: empty-state                                         lineage: unified-system original (prototype/app-flow/report)
PURPOSE: A centered placeholder block - no-data, zero-results, all-clear, or error
         screens for prototypes and result panels. A glyph in a soft disc + title +
         description + optional action button. Dashed-bordered to read as a slot.
VARIABLES: {{ICON_PATH}}  {{TITLE}}  {{BODY}}  {{ACTION}}
REQUIRES: core/elements.css (.btn), core/tokens.css (--bg-surface, --bg-muted,
          --border-default, --color-*, --text-*, --radius-lg, --sp-*, --type-*)
MODULE CSS: inline the data-module="empty-state" style block once. Tone the disc
            with .-success / -danger for all-clear / error variants.
INTERACTION: none (the action is a static button placeholder).
USAGE: one <section class="empty-state"> centered in its column or device screen.
============================================================================ -->
<style data-module="empty-state">
  .empty-state { position: relative; display: grid; justify-items: center; text-align: center; gap: var(--sp-3); padding: var(--sp-8) var(--sp-5); border: 1px dashed var(--border-default); border-radius: var(--radius-lg); background: linear-gradient(var(--bg-surface), var(--bg-surface)) padding-box, color-mix(in srgb, var(--accent) 4%, var(--bg-surface)); box-shadow: var(--shadow-sm); transition: border-color var(--dur-mid) var(--ease), box-shadow var(--dur-mid) var(--ease); }
  /* a faint accent glow pooled behind the glyph adds quiet atmospheric depth */
  .empty-state::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(60% 42% at 50% 26%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 70%); }
  .empty-state > * { position: relative; }
  .es-ic { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-muted); color: var(--text-muted); border: 1px solid var(--border-subtle); box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--bg-surface) 70%, transparent); transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
  .es-ic svg { width: 28px; height: 28px; }
  .es-title { font: var(--type-h3); letter-spacing: var(--tracking-tight); }
  .es-body { font: var(--type-small); color: var(--text-secondary); max-width: 42ch; margin: 0; text-wrap: pretty; }
  .empty-state.-success .es-ic { color: var(--color-success); background: color-mix(in srgb, var(--color-success) 12%, var(--bg-muted)); border-color: color-mix(in srgb, var(--color-success) 30%, var(--border-subtle)); }
  .empty-state.-danger  .es-ic { color: var(--color-danger);  background: color-mix(in srgb, var(--color-danger) 12%, var(--bg-muted)); border-color: color-mix(in srgb, var(--color-danger) 30%, var(--border-subtle)); }
  .empty-state .btn { margin-top: var(--sp-1); }
  /* the slot firms toward the accent on hover; neutral disc warms to accent tint */
  @media (hover: hover) {
    .empty-state:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border-default)); box-shadow: var(--shadow-md); }
    .empty-state:hover .es-ic { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg-muted)); border-color: color-mix(in srgb, var(--accent) 32%, var(--border-subtle)); }
    .empty-state.-success:hover .es-ic { color: var(--color-success); background: color-mix(in srgb, var(--color-success) 16%, var(--bg-muted)); border-color: color-mix(in srgb, var(--color-success) 40%, var(--border-subtle)); }
    .empty-state.-danger:hover .es-ic { color: var(--color-danger); background: color-mix(in srgb, var(--color-danger) 16%, var(--bg-muted)); border-color: color-mix(in srgb, var(--color-danger) 40%, var(--border-subtle)); }
  }
</style>

<section class="empty-state" aria-label="{{TITLE}}">
  <span class="es-ic">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ICON_PATH}}</svg>
  </span>
  <h3 class="es-title">{{TITLE}}</h3>
  <p class="es-body">{{BODY}}</p>
  <button class="btn" type="button">{{ACTION}}</button>
</section>

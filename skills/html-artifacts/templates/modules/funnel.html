<!-- ============================================================================
MODULE: funnel                                              lineage: unified-system original (dashboard/report)
PURPOSE: A conversion funnel - ordered stages whose bars share one left edge on a
         faint track (width ∝ value / first-stage value), each with a value readout, the
         share of the first stage and the step conversion from the previous stage. For
         drop-off / pipeline analytics. (A centred taper turned a 1% stage into an
         unreadable sliver, so bars are left-aligned.)
VARIABLES (per stage): {{STAGE_LABEL}}  {{VALUE}} (display)  {{OF_TOP}} (e.g. "9% of first stage")
                       {{PCT}} (bar width = value / firstValue × 100)  {{STEP}} (e.g. "→ 8.8%")  {{CAT}}
REQUIRES: core/elements.css (.card-outlined), core/tokens.css (--cat-1..5, --accent,
          --text-*, --radius-sm, --sp-*)
MODULE CSS: inline the funnel module style block once (the data-module="funnel" one below).
INTERACTION: none (static).
USAGE: one <section class="funnel"> with one .fn-row per stage (top → bottom). Prefer the
       builder `funnel` section: it computes widths, both rates and number grouping.
============================================================================ -->
<style data-module="funnel">
  .funnel h2 { font: var(--type-h3); margin-bottom: var(--sp-4); }
  .funnel .fn-row + .fn-row { margin-top: var(--sp-3); }
  .funnel .fn-row { padding: var(--sp-1) var(--sp-2); border-radius: var(--radius-sm); transition: background var(--dur-fast) var(--ease); }
  .fn-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-3); margin-bottom: var(--sp-1); }
  .fn-label { font: var(--type-small); color: var(--text-secondary); transition: color var(--dur-fast) var(--ease); }
  .fn-val { font: var(--type-small); font-family: var(--font-mono); font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fn-pct { color: var(--text-muted); font-weight: 500; margin-inline-start: var(--sp-2); }
  /* bars share one left edge on a faint track, so even a 1% stage stays comparable */
  .fn-barwrap { position: relative; display: flex; align-items: center; gap: var(--sp-2); height: 26px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--bg-muted) 70%, transparent); }
  .fn-bar { height: 100%; min-width: 4px; border-radius: var(--radius-sm); background: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text-primary) 8%, transparent); transition: filter var(--dur-fast) var(--ease); }
  .fn-bar.cat-1 { background: var(--cat-1); } .fn-bar.cat-2 { background: var(--cat-2); } .fn-bar.cat-3 { background: var(--cat-3); }
  .fn-bar.cat-4 { background: var(--cat-4); } .fn-bar.cat-5 { background: var(--cat-5); }
  /* step conversion (vs the previous stage) rides just right of the bar */
  .fn-step { font: var(--type-caption); font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-secondary); white-space: nowrap; }
  .funnel .fn-row:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .funnel .fn-row:hover .fn-label { color: var(--text-primary); }
  @media (hover: hover) { .funnel .fn-row:hover .fn-bar { filter: brightness(1.05); } }
  @media (prefers-reduced-motion: reduce) { .funnel .fn-row, .fn-label, .fn-bar { transition: none; } }
</style>

<section class="funnel card-outlined" aria-label="{{TITLE}}">
  <h2>{{TITLE}}</h2>

  <!-- ── one .fn-row per stage, top to bottom ───────────────────────────── -->
  <div class="fn-row">
    <div class="fn-head">
      <span class="fn-label">{{STAGE_LABEL}}</span>
      <span class="fn-val">{{VALUE}}<span class="fn-pct">{{OF_TOP}}</span></span>
    </div>
    <div class="fn-barwrap"><div class="fn-bar cat-1" style="width:{{PCT}}%"></div><span class="fn-step">{{STEP}}</span></div>
  </div>
</section>

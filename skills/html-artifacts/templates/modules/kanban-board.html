<!-- ============================================================================
MODULE: kanban-board                                         lineage: html-visual(kanban) + demo2(kanban-sprint HTML5 DnD)
PURPOSE: Drag-drop kanban. Horizontal flex of columns; each column has a header
         (title + count .badge) and a .kanban-cards drop zone of .kanban-card
         items (title + .chip tags + assignee). NO external libs.
VARIABLES: per column {{COL_TITLE}} {{COUNT}}  +  per card {{CARD_TITLE}} {{TAG}} {{ASSIGNEE}}
REQUIRES: core/elements.css (.badge .chip .card-outlined .cluster .small .muted),
          core/tokens.css (--accent --bg-* --text-* --sp-* --radius-* --shadow-*),
          core/interactions.js (HA.kanban → wires [data-kanban])
MODULE CSS: inline the data-module="kanban-board" style block once.
INTERACTION: [data-kanban] + [data-col] > .kanban-cards > .kanban-card.
             JS adds .dragging to the lifted card and .drop-target to the
             column under the cursor; drop appends the card to .kanban-cards.
USAGE: repeat the .kanban-col block once per column (3 below); inside each,
       repeat the .kanban-card block once per card. Theme-agnostic.
============================================================================ -->
<style data-module="kanban-board">
  .kanban { display: flex; gap: var(--sp-4); align-items: flex-start; overflow-x: auto; padding-bottom: var(--sp-2); }
  .kanban-col { flex: 1 0 260px; min-width: 240px; background: var(--bg-muted); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--sp-3); transition: outline-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
  /* calm accent-tint while a card hovers the column as a drop zone */
  .kanban-col.drop-target { outline: 2px dashed var(--accent); outline-offset: 2px; background: color-mix(in srgb, var(--accent) 7%, var(--bg-muted)); border-color: color-mix(in srgb, var(--accent) 40%, var(--border-subtle)); }
  /* header gets a hairline base + a short accent tick rail under the title */
  .kanban-col-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); padding: var(--sp-1) var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--border-subtle); margin-bottom: var(--sp-3); }
  .kanban-col-title { position: relative; font: var(--type-h3); color: var(--text-primary); padding-left: var(--sp-3); }
  .kanban-col-title::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 0.9em; border-radius: var(--radius-pill); background: var(--accent); }
  .kanban-cards { display: flex; flex-direction: column; gap: var(--sp-3); min-height: var(--sp-7); }
  /* card micro-interaction: accent-tied edge + gentle depth on hover/focus */
  .kanban-card { cursor: grab; transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease-out); }
  .kanban-card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border-default)); box-shadow: var(--shadow-sm); }
  .kanban-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .kanban-card:active { cursor: grabbing; }
  /* lifted card: tinted edge + raised shadow signals it has left its slot */
  .kanban-card.dragging { opacity: .5; border-color: color-mix(in srgb, var(--accent) 55%, var(--border-default)); box-shadow: var(--shadow-md); }
  .kanban-card-title { font: var(--type-small); font-weight: 600; color: var(--text-primary); }
  .kanban-card-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); margin-top: var(--sp-2); }
  @media (hover: hover) and (prefers-reduced-motion: no-preference) {
    .kanban-card:hover { transform: translateY(-1px); }
  }
</style>

<section aria-label="Kanban board">
  <div class="kanban" data-kanban>

    <!-- ↓ repeat one column per status (3 columns) -->
    <div class="kanban-col" data-col="{{COL_TITLE}}">
      <header class="kanban-col-head">
        <span class="kanban-col-title">{{COL_TITLE}}</span>
        <span class="badge">{{COUNT}}</span>
      </header>
      <div class="kanban-cards">

        <!-- ↓ repeat one card per task -->
        <article class="kanban-card card-outlined" tabindex="0" aria-roledescription="Draggable card">
          <p class="kanban-card-title">{{CARD_TITLE}}</p>
          <div class="cluster" style="gap: var(--sp-1); margin-top: var(--sp-2);">
            <span class="chip">{{TAG}}</span>   <!-- repeat .chip per tag -->
          </div>
          <div class="kanban-card-foot">
            <span class="small muted">{{ASSIGNEE}}</span>
          </div>
        </article>
        <!-- ↑ repeat card -->

      </div>
    </div>
    <!-- ↑ repeat column -->

  </div>
</section>

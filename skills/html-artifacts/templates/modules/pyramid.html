<!-- ============================================================================
MODULE: pyramid                                             lineage: unified-system original (strategy/hierarchy)
PURPOSE: Self-contained SVG layered pyramid (NO external libs). 3-5 stacked
         trapezoid bands (apex = triangle) narrowing to the top, each with a
         centered label and a right-side supplement drawn on a leader line. The
         --accent color-mix density steps per layer so the hierarchy reads as tone.
         For Maslow-style hierarchies, strategy→tactics→execution, the test pyramid.
VARIABLES: {{TITLE}} + per layer {{LAYER_LABEL}} {{LAYER_NOTE}} and its --d density.
GEOMETRY:  cx=210, apexY=24, baseY=312, halfBase=180 → base spans x=30…390.
           At height y the half-width hw(y)=halfBase·(y−apexY)/(baseY−apexY).
           A band from yTop→yBot is the polygon
           "cx−hw(yTop),yTop  cx+hw(yTop),yTop  cx+hw(yBot),yBot  cx−hw(yBot),yBot".
           The top band collapses hw(apexY)=0 to a triangle. For N equal layers,
           step y by (baseY−apexY)/N. Label centers at ((apexY+baseY split), cx).
           Leader: from (cx+hw(midY),midY) → (430,midY) with the note text at x=438.
REQUIRES: core/tokens.css (--accent, --bg-surface, --border-*, --text-*, --sp-*, --font-mono)
MODULE CSS: inline the data-module="pyramid" style block once.
INTERACTION: none (static). role="img" + <title> a11y.
USAGE: one <polygon class="pyr-band" style="--d:NN%"> per layer (density steps,
       densest at the apex); one <text class="pyr-label"> centered; optional leader
       <line class="pyr-lead"> + <text class="pyr-note"> per layer. Recompute band
       polygons + label y if you change layer count (see GEOMETRY).
============================================================================ -->
<style data-module="pyramid">
  .pyr { margin: 0; }
  .pyr-title { font: var(--type-h3); color: var(--text-primary); margin-bottom: var(--sp-4); }
  .pyr svg { width: 100%; height: auto; max-width: 560px; margin-inline: auto; display: block; overflow: visible; font-family: var(--font-sans); }
  @media (max-width: 640px) { .pyr { overflow-x: auto; } .pyr svg { min-width: 560px; } }
  /* each band's fill density is driven by its inline --d (accent → surface mix) */
  .pyr-band { fill: color-mix(in srgb, var(--accent) var(--d, 40%), var(--bg-surface)); stroke: var(--bg-surface); stroke-width: 2; transition: fill var(--dur-fast) var(--ease); }
  .pyr-band:hover { fill: color-mix(in srgb, var(--accent) calc(var(--d, 40%) + 12%), var(--bg-surface)); }
  .pyr-label { fill: var(--text-primary); font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
  .pyr-lead { stroke: var(--border-default); stroke-width: 1; stroke-dasharray: 3 3; }
  .pyr-note { fill: var(--text-secondary); font: var(--type-caption); font-family: var(--font-mono); dominant-baseline: middle; }
  @media (prefers-reduced-motion: reduce) { .pyr-band { transition: none; } }
</style>

<figure class="pyr card-outlined">
  <figcaption class="pyr-title">{{TITLE}}</figcaption>
  <svg viewBox="0 0 560 340" role="img" aria-label="{{TITLE}}">
    <title>{{TITLE}}</title>

    <!-- ── bands, apex → base (densest at the top) ─────────────────────────── -->
    <polygon class="pyr-band" style="--d:60%" points="210,24 270,120 150,120"/>
    <polygon class="pyr-band" style="--d:42%" points="150,120 270,120 330,216 90,216"/>
    <polygon class="pyr-band" style="--d:26%" points="90,216 330,216 390,312 30,312"/>
    <!-- ↑ repeat: one .pyr-band per layer; step --d down and recompute points -->

    <!-- ── centered layer labels ───────────────────────────────────────────── -->
    <text class="pyr-label" x="210" y="96">{{LAYER_LABEL}}</text>  <!-- e.g. ビジョン -->
    <text class="pyr-label" x="210" y="170">{{LAYER_LABEL}}</text> <!-- e.g. 戦略 -->
    <text class="pyr-label" x="210" y="266">{{LAYER_LABEL}}</text> <!-- e.g. 実行 -->

    <!-- ── right-side supplements on leader lines (optional, one per layer) ──── -->
    <line class="pyr-lead" x1="270" y1="96" x2="430" y2="96"/>
    <text class="pyr-note" x="438" y="96">{{LAYER_NOTE}}</text>   <!-- e.g. 3〜5年 -->
    <line class="pyr-lead" x1="330" y1="170" x2="430" y2="170"/>
    <text class="pyr-note" x="438" y="170">{{LAYER_NOTE}}</text>  <!-- e.g. 年次計画 -->
    <line class="pyr-lead" x1="390" y1="266" x2="430" y2="266"/>
    <text class="pyr-note" x="438" y="266">{{LAYER_NOTE}}</text>  <!-- e.g. 日々の運用 -->
    <!-- ↑ repeat -->
  </svg>
</figure>
